<script type="application/json" id="docs">{"readme": "# 30 Days with C#\n\nA 30-day C# course, built to work with no AI help. Plan on 1\u20132 hours a day.\n\n**Progress:** Days 1\u20133 done. **Next up: Day 4.**\n\n## Where to go\n\n| File | What it's for |\n|---|---|\n| [REVISION.md](REVISION.md) | Start here: quiz on Days 1\u20133, with answers |\n| [WEEK1.md](WEEK1.md) | Full lessons for Days 4\u20137 |\n| [ROADMAP.md](ROADMAP.md) | Goals, key ideas and exercises for Days 8\u201330 |\n| [ERRORS.md](ERRORS.md) | What common compiler errors mean and how to fix them |\n| [REWARDS.md](REWARDS.md) | Points and rewards |\n| [my-code/](my-code/) | The code you've written so far |\n\n## Getting stuck without AI\n\nWork through these in order:\n\n1. **Read the error.** Note the file, the line and column, and the error code.\n2. **Look it up** in [ERRORS.md](ERRORS.md).\n3. **Check the line above too.** A missing `;` or `}` is often reported one line late.\n4. **Use `Console.WriteLine`** to print your variables and see what they really hold.\n5. **Search the error code**, for example `C# CS0165`. Good sources are [Microsoft Learn](https://learn.microsoft.com/en-us/dotnet/csharp/) and Stack Overflow.\n6. **Still stuck after 20 minutes?** Write down the problem, move on, and bring it back later.\n\n## If the computer has no .NET\n\nSee [ONLINE.md](ONLINE.md) to run your code in a browser.\n\nIf you can't get online either, write the code on paper and trace it by hand. It's great practice.\n\n## Starting each day\n\n```bash\ncd ~ && dotnet new console -o Day04 && cd Day04\n```\n\nOnly one file in a project can have top-level code. Rename old experiments so they don't end in `.cs`, or use a new project.\n\n## The daily routine\n\n1. **Learn (20\u201330 min):** read the lesson and run the examples.\n2. **Build (45\u201360 min):** do the exercise without copying.\n3. **Test:** run every test value, especially the boundaries.\n4. **Break it (10 min):** change something, read the error, and fix it.\n5. **Answer the check-yourself questions** from memory.\n6. **Log it:** add your points in [REWARDS.md](REWARDS.md).\n\n## Saving your work\n\nCopy your project into `my-code/` first, then run this from the repo folder:\n\n```bash\ngit add . && git commit -m \"Finish Day 4\" && git push\n```\n\nTo get this repo on another computer:\n\n```bash\ngh repo clone dsksnkz/30Days-with-csharp\n```\n\n## The plan\n\n| Week | Topic | Project |\n|---|---|---|\n| 1 | Fundamentals | Console quiz game |\n| 2 | Object-oriented programming | Library management system |\n| 3 | Collections, generics, LINQ, files | Expense tracker that saves its data |\n| 4 | Async, APIs, testing, databases, web | To-do REST API |\n| Days 28\u201330 | Putting it all together | Task manager API on GitHub |\n", "revision": "# Revision: Days 1\u20133\n\nAnswer from memory first. The answers are at the bottom.\n\n## Predict the output\n\n**1.**\n```csharp\nConsole.Write(\"A\");\nConsole.WriteLine(\"B\");\nConsole.Write(\"C\");\n```\n\n**2.**\n```csharp\nConsole.WriteLine(9 / 2);\nConsole.WriteLine(9.0 / 2);\nConsole.WriteLine((int)4.9);\n```\n\n**3.**\n```csharp\ndouble price = 3.14159;\nConsole.WriteLine($\"{price:F2}\");\n```\n\n**4.**\n```csharp\nint score = 75;\nstring grade;\n\nif (score >= 60)\n{\n    grade = \"D\";\n}\nelse if (score >= 70)\n{\n    grade = \"C\";\n}\nelse\n{\n    grade = \"F\";\n}\n\nConsole.WriteLine(grade);\n```\n\n**5.**\n```csharp\nint age = 20;\nbool isTeen = age >= 13 && age <= 19;\nConsole.WriteLine(isTeen);\n```\n\n## Spot the bug\n\nEach of these won't compile. Say why.\n\n**6.**\n```csharp\nint age = \"twenty\";\n```\n\n**7.**\n```csharp\nstring name = \"Alex\";\nstring name = \"Sam\";\n```\n\n**8.**\n```csharp\nint x = 5;\n\nif (x > 3)\n{\n    string message = \"big\";\n}\n\nConsole.WriteLine(message);\n```\n\n## Write it\n\n**9.** In one line, read a number from the user into a `double` called `height`.\n\n**10.** Write an `if`/`else` that prints `\"Valid\"` if `age` is from 0 to 120, and `\"Invalid\"` otherwise.\n\n---\n\n## Answers\n\nStop here until you've tried them all.\n\n1. `AB`, then `C` on the next line. `Write` stays on the line and `WriteLine` ends it.\n2. `4`, then `4.5`, then `4`. Dividing two `int`s drops the decimal, and a cast cuts it off without rounding.\n3. `3.14`\n4. `D`. The first match wins, and 75 matches `>= 60` first, so the largest check has to come first. A switch expression written in this order wouldn't compile at all: `>= 70` could never be reached, so you'd get error CS8510.\n5. `False`. The `&&` needs both sides to be true, and `20 <= 19` isn't.\n6. `\"twenty\"` is a string, and an `int` can't hold a string.\n7. `name` is declared twice. The second line should be `name = \"Sam\";`.\n8. `message` only exists inside the `{ }` where it was created. This is scope.\n9. `double height = double.Parse(Console.ReadLine()!);`\n10.\n```csharp\nif (age >= 0 && age <= 120)\n{\n    Console.WriteLine(\"Valid\");\n}\nelse\n{\n    Console.WriteLine(\"Invalid\");\n}\n```\n\n## The main points so far\n\n- **Parsing:** `ReadLine()` always gives text. Use `int.Parse` or `double.Parse` to get a number. Typing `abc` crashes with a `FormatException`, and `null` is a different thing: it means no value at all.\n- **`=` vs. `==`:** `=` assigns and `==` compares.\n- **Declaring:** writing the type (`string x`) creates a variable, so do that only once.\n- **Order:** the first matching branch wins.\n- **Scope:** a variable exists only inside the `{ }` where it was created.\n- **Semicolons:** blocks end with `}`, and assignments end with `;`, including a switch expression.\n- **Testing:** test the boundaries (60 and 59), because compiling doesn't mean correct.\n", "week1": "# Week 1, continued: Days 4\u20137\n\n---\n\n# Day 4: Loops\n\n**Goal:** build a number guessing game.\n\n## `for`: when you know how many times\n\n```csharp\nfor (int i = 1; i <= 5; i++)\n{\n    Console.WriteLine(i);\n}\n```\n\nThis prints 1 to 5. The three parts are the start (`int i = 1`), the check that keeps it going (`i <= 5`), and the step after each run (`i++`, which adds 1).\n\n## `while`: until something changes\n\n```csharp\nint lives = 3;\n\nwhile (lives > 0)\n{\n    Console.WriteLine($\"Lives: {lives}\");\n    lives--;\n}\n```\n\nThe check runs before each loop. If you forget `lives--`, it never ends, which is an infinite loop. Press **Ctrl+C** to stop one.\n\n## `do`/`while`: run at least once\n\n```csharp\nstring? answer;\n\ndo\n{\n    Console.Write(\"Type yes: \");\n    answer = Console.ReadLine();\n} while (answer != \"yes\");\n```\n\n`answer` is declared outside the loop because of scope: the `while` line sits outside the `{ }`.\n\n## `foreach`: every item in a group\n\n```csharp\nstring word = \"cat\";\n\nforeach (char letter in word)\n{\n    Console.WriteLine(letter);\n}\n```\n\n## `break` and `continue`\n\n```csharp\nfor (int i = 1; i <= 10; i++)\n{\n    if (i == 3)\n    {\n        continue; // skip the rest of this run and go to 4\n    }\n\n    if (i == 6)\n    {\n        break; // leave the loop completely\n    }\n\n    Console.WriteLine(i);\n}\n```\n\nThis prints 1, 2, 4, 5.\n\n## Random numbers\n\n```csharp\nint secret = Random.Shared.Next(1, 101);\n```\n\nThis gives a number from 1 to 100. **The upper limit isn't included**, which is why it's 101.\n\n## Exercise: number guessing game\n\n1. Pick a secret number from 1 to 100.\n2. Keep asking for a guess until the player gets it.\n3. After each wrong guess, print `Too high` or `Too low`.\n4. Count the guesses, and print the total when the player wins.\n\n**Hint:** you need one `int` for the guess and one for the count. Declare them before the loop.\n\nWhile testing, print `secret` at the start so you know the answer, and remove that line when you're done.\n\n| Secret | Input | Expected result |\n|---|---|---|\n| 50 | 75 | Too high |\n| 50 | 25 | Too low |\n| 50 | 50 | You win, 3 guesses |\n\n**Bonus 1:** give the player only 7 guesses, then reveal the number.\n\n**Bonus 2:** ask `Play again?` at the end, using `do`/`while` around the whole game.\n\n## Check yourself\n\n1. When would you pick `while` over `for`?\n2. What's the difference between `while` and `do`/`while`?\n3. What's the difference between `break` and `continue`?\n4. Can `Random.Shared.Next(1, 10)` ever give 10?\n5. How do you stop a program stuck in an infinite loop?\n\n---\n\n# Day 5: Methods\n\n**Goal:** split your code into reusable, named pieces.\n\n## Writing a method\n\n```csharp\nGreet(\"Alex\");\nint total = Add(2, 3);\nConsole.WriteLine(total);\n\nvoid Greet(string name)\n{\n    Console.WriteLine($\"Hi {name}\");\n}\n\nint Add(int a, int b)\n{\n    return a + b;\n}\n```\n\n- **Return type:** `void` returns nothing, and `int` promises to return an `int`.\n- **Parameters:** `name`, `a` and `b` are the inputs. Each needs a type.\n- **`return`:** this sends the answer back and ends the method immediately.\n- **Top-level order:** put your main code first and your methods at the bottom. Local methods work anywhere in the file, but this order is tidier.\n\n## Overloads and default values\n\nMethods can share a name if their parameters differ:\n\n```csharp\nint Square(int n)\n{\n    return n * n;\n}\n\ndouble Square(double n)\n{\n    return n * n;\n}\n```\n\nNote: real overloads go inside a class, which you'll do on Day 8. **In top-level code, this example gives error CS0128**, because local methods can't be overloaded. For now, use different names like `SquareInt` and `SquareDouble`.\n\nDefault values make a parameter optional:\n\n```csharp\nvoid Say(string text, int times = 1)\n{\n    for (int i = 0; i < times; i++)\n    {\n        Console.WriteLine(text);\n    }\n}\n```\n\n`Say(\"hi\");` prints once, and `Say(\"hi\", 3);` prints three times.\n\n## Exercise: calculator\n\nWrite these methods: `Add`, `Subtract`, `Multiply` and `Divide`, each taking two `double`s and returning a `double`. Add `ReadNumber(string prompt)`, which prints the prompt and returns the parsed number.\n\nThen ask for two numbers and an operator (`+`, `-`, `*`, `/`), use a switch expression to pick the method, and print the result to 2 decimal places.\n\n| Input | Expected result |\n|---|---|\n| 6, +, 3 | 9.00 |\n| 6, -, 3 | 3.00 |\n| 6, *, 3 | 18.00 |\n| 7, /, 2 | 3.50 |\n| 6, /, 0 | See bonus |\n\nDividing a `double` by 0 doesn't crash. Run it and see what prints.\n\n**Bonus:** make it print a clear error when dividing by 0.\n\n## Check yourself\n\n1. What does `void` mean?\n2. What happens to code after a `return` in the same block?\n3. What's the difference between a parameter and a local variable?\n4. Why is `ReadNumber` better than repeating two lines each time?\n\n---\n\n# Day 6: Arrays and strings\n\n**Goal:** work with lists of values and text.\n\n## Arrays\n\n```csharp\nint[] scores = { 90, 75, 60 };\n\nConsole.WriteLine(scores[0]);     // 90: counting starts at 0\nConsole.WriteLine(scores.Length); // 3\nscores[1] = 80;\n\nint[] empty = new int[5];         // five zeros\n\nforeach (int score in scores)\n{\n    Console.WriteLine(score);\n}\n```\n\nAn array's size is fixed. `scores[3]` here crashes with `IndexOutOfRangeException`, because the last index is `Length - 1`.\n\n## Strings\n\n```csharp\nstring text = \"  Hello World  \";\n\nConsole.WriteLine(text.Trim());            // removes outer spaces\nConsole.WriteLine(text.ToLower());\nConsole.WriteLine(text.Contains(\"World\")); // True\nConsole.WriteLine(text.Replace(\"World\", \"C#\"));\nConsole.WriteLine(text.Trim().Length);     // 11\nConsole.WriteLine(text.Trim()[0]);         // H: a single char\n\nstring[] words = \"one two three\".Split(' ');\nConsole.WriteLine(words.Length);           // 3\n```\n\nStrings can't be changed. `text.ToUpper();` on its own does nothing useful, so store the result: `text = text.ToUpper();`.\n\n`Trim()` would also have fixed your double-space problem on Day 3.\n\n## `StringBuilder`\n\nUse this when building text in a loop. It's faster than adding to a string over and over.\n\n```csharp\nusing System.Text;\n\nvar builder = new StringBuilder();\n\nfor (int i = 0; i < 3; i++)\n{\n    builder.Append(i);\n    builder.Append(' ');\n}\n\nConsole.WriteLine(builder.ToString()); // 0 1 2\n```\n\n`using` lines go at the very top of the file.\n\n## Exercise: text analyzer\n\nAsk for a sentence, then print:\n1. The number of characters.\n2. The number of words.\n3. The number of vowels (a, e, i, o, u), counting capitals too.\n4. The sentence reversed. Use `StringBuilder` and a `for` loop counting down.\n\n| Input | Characters | Words | Vowels | Reversed |\n|---|---|---|---|---|\n| `Hello World` | 11 | 2 | 3 | `dlroW olleH` |\n| `C# is fun` | 9 | 3 | 2 | `nuf si #C` |\n\n**Bonus:** say whether the input is a palindrome, ignoring capitals. `Level` should say yes.\n\n## Check yourself\n\n1. What's the index of the last item in an array of 10?\n2. Why doesn't `text.ToUpper();` change `text`?\n3. What's the difference between `'a'` and `\"a\"`?\n4. When is `StringBuilder` worth using?\n\n---\n\n# Day 7: Project: console quiz game\n\nNo new topics today. You're combining everything, without a walkthrough.\n\n## Requirements\n\n1. Ask for the player's name, and use `Trim()` on it.\n2. Store at least 5 questions in a `string[]`, with the correct answers in a second `string[]` at matching positions.\n3. Loop through the questions and ask each one.\n4. Compare answers while ignoring capitals and extra spaces.\n5. Say whether each answer was right, and show the correct one if not.\n6. At the end, print the score and percentage to 1 decimal place.\n7. Print a rank using a switch expression: 100% is `Perfect`, 60% or above is `Passed`, and anything else is `Try again`.\n8. Use at least 2 methods of your own, such as `AskQuestion` and `GetRank`.\n\n## Watch out\n\n- `score / total * 100` with two `int`s gives 0 for most scores, because of the `7 / 2` trap. Use `(double)score / total * 100`.\n- If `GetRank` needs to return a result, its return type can't be `void`.\n\n## Test it\n\n| Scenario (5 questions) | Expected result |\n|---|---|\n| All correct | 100.0%, Perfect |\n| 3 correct | 60.0%, Passed |\n| 2 correct | 40.0%, Try again |\n| All wrong | 0.0%, Try again |\n| Answer typed as `  PARIS  ` when correct is `Paris` | Counts as correct |\n\n## Bonus\n\n- Ask whether to play again.\n- Allow only numbers 1\u20134 for multiple-choice answers, and ask again for anything else.\n\n**Well done: that's Week 1. Check [REWARDS.md](REWARDS.md) for your milestone reward.**\n", "roadmap": "# Roadmap: Days 8\u201330\n\nEach day lists what to learn, the main ideas, and what to build. Read the linked topic on [Microsoft Learn](https://learn.microsoft.com/en-us/dotnet/csharp/) for the details. Searching `C# <topic name>` also works well.\n\nFrom now on, classes usually go in their own file, named after the class.\n\n## Week 2: Object-oriented programming\n\n**Day 8: Classes and objects.** A class is a blueprint, and an object is one thing made from it. Learn fields, methods and constructors.\n```csharp\nclass BankAccount\n{\n    private decimal balance;\n\n    public BankAccount(decimal startingBalance)\n    {\n        balance = startingBalance;\n    }\n\n    public void Deposit(decimal amount)\n    {\n        balance += amount;\n    }\n\n    public decimal GetBalance()\n    {\n        return balance;\n    }\n}\n```\n**Build:** `BankAccount` with `Deposit`, `Withdraw` and an owner name. Make two accounts and show that they keep separate balances.\n\n**Day 9: Properties and encapsulation.** Learn `public` vs. `private`, and `{ get; private set; }`. Hide data so that only the class can change it.\n**Build:** make `BankAccount` reject negative deposits and any withdrawal larger than the balance. Test with 0, a negative amount, and exactly the full balance.\n\n**Day 10: Inheritance.** Learn `class Manager : Employee`, plus `virtual`, `override` and `base`.\n**Build:** `Employee` with `CalculatePay()`, then `Manager` and `Intern`, which each override it.\n\n**Day 11: Interfaces and polymorphism.** An interface is a promise of what a class can do. Code can use `IPayment` without knowing which class it has.\n**Build:** an `IPayment` interface with `Pay(decimal amount)`, then `CardPayment` and `CashPayment`. Loop through an array of `IPayment`.\n\n**Day 12: Abstract classes, `static` and enums.** An abstract class can't be created directly. `static` members belong to the class rather than to an object. Enums are named options.\n**Build:** abstract `Shape` with `Area()`, then `Circle` and `Rectangle`. Add a static counter of the shapes created.\n\n**Day 13: Structs, records and nullable types.** Value types get copied, and reference types share one object. Records give you easy immutable data. Learn `string?`, `??` and `?.`, which finally explains warning CS8602 from Day 1.\n**Build:** a `record Book(string Title, string Author)`. Show what `==` does on records vs. classes, and handle a `null` from `ReadLine()` with `??`.\n\n**Day 14: Project: library management system.** `Book` and `Member` classes, and a `Library` class. Support adding books, borrowing, returning and listing. A book that's already borrowed can't be borrowed again. Use a console menu in a loop.\n\n## Week 3: Writing real C#\n\n**Day 15: Collections.** `List<T>` grows as needed, `Dictionary<K,V>` looks up by key, `HashSet<T>` has no duplicates, `Queue<T>` is first in, first out, and `Stack<T>` is last in, first out.\n**Build:** a contact book with add, find, delete and list, using a `Dictionary`.\n\n**Day 16: Generics.** Write one class that works with any type: `class Repository<T>`. Constraints limit which types are allowed: `where T : class`.\n**Build:** `Repository<T>` with `Add`, `GetAll` and `Remove`, used with two different classes.\n\n**Day 17: Exceptions.** Learn `try`, `catch` and `finally`, `throw`, and `int.TryParse`. This is the proper fix for the `abc` crash from Day 2.\n```csharp\nif (int.TryParse(Console.ReadLine(), out int number))\n{\n    Console.WriteLine(number);\n}\nelse\n{\n    Console.WriteLine(\"Not a number\");\n}\n```\n**Build:** a `ReadInt` method that keeps asking until the input is valid. Add a custom `InsufficientFundsException` to `BankAccount`.\n\n**Day 18: Delegates, lambdas and events.** `Func<int, int>` and `Action<string>` hold methods in variables. A lambda is a short method: `x => x * 2`. Events let objects announce that something happened.\n**Build:** a `Notifier` class with an event, and two subscribers that react differently.\n\n**Day 19: LINQ basics.** Learn `Where`, `Select`, `OrderBy`, `First`, `Any` and `ToList`.\n```csharp\nvar cheap = products.Where(p => p.Price < 10).OrderBy(p => p.Name).ToList();\n```\n**Build:** a list of 10 products, with search by name, a price filter and sorting.\n\n**Day 20: Advanced LINQ.** Learn `GroupBy`, `Join`, `Sum`, `Average`, `Max` and `Count`.\n**Build:** a sales report showing total per category, best seller and average order.\n\n**Day 21: Project: expense tracker.** Add, list and delete expenses, with totals per category. Save to JSON with `System.Text.Json` and `File.WriteAllText`, and load it on startup. Close the program, reopen it, and check that the data is still there. This is also a good time to build your rewards tracker.\n\n## Week 4: Professional tools\n\n**Day 22: Async.** `async`, `await` and `Task` let your program wait without freezing. Learn `Task.WhenAll` and `Task.Delay`.\n**Build:** simulate 3 slow downloads with `Task.Delay`. Time them run one after another and then together.\n\n**Day 23: HTTP and NuGet.** Learn `HttpClient`, how to read JSON from an API, and `dotnet add package`.\n**Build:** a weather app using the free [Open-Meteo API](https://open-meteo.com/), which needs no key. Handle network failures.\n\n**Day 24: Modern C#.** Learn pattern matching with `is` and `when`, extension methods, and collection expressions.\n**Build:** refactor your library system using what you learned, keeping its behavior the same.\n\n**Day 25: Unit testing.** Run `dotnet new xunit`, then learn `[Fact]`, `[Theory]`, `Assert` and `dotnet test`.\n**Build:** tests for the expense tracker, including boundaries and bad input.\n\n**Day 26: Databases.** Learn basic SQL (`SELECT`, `INSERT`, `UPDATE`, `DELETE`), then Entity Framework Core with SQLite.\n**Build:** move the expense tracker from JSON to a database.\n\n**Day 27: Web APIs.** Run `dotnet new web`, then learn `MapGet` and `MapPost`, route parameters, and status codes (200, 201, 404, 400).\n**Build:** a to-do REST API. Test it with `curl`.\n\n## Final stretch: capstone\n\n**Day 28: Design.** Learn dependency injection and how to split a project into endpoints, services and data.\n**Build:** the task manager API's data model, database and project structure.\n\n**Day 29: Finish the features.** Add full create, read, update and delete, filtering by status, validation with clear errors, and tests.\n\n**Day 30: Ship it.** Add logging and configuration, run `dotnet publish`, write a good README, and push it to GitHub.\n\n**That's the course. Claim your Day 30 prize!**\n", "errors": "# Common errors\n\nAn error looks like this: `Program.cs(5,50): error CS1002: ; expected`. That's the file, line 5, column 50, the code, and the message.\n\n**Fix the first error first.** One mistake can cause many errors further down, as you saw when CS1003 and CS8504 appeared together on Day 3. **Errors** stop the build, and **warnings** don't.\n\n## Compiler errors\n\n| Code | What it says | What it usually means | Fix |\n|---|---|---|---|\n| CS1002 | `; expected` | Missing semicolon | Add `;` at the end of that line or the one above |\n| CS1003 | `',' expected` | Missing comma, often in a switch expression | Add a comma between the arms |\n| CS1513 | `} expected` | A `{` was never closed | Match up your braces, and indenting helps |\n| CS1525 | Invalid expression term | Something unfinished just before this point | Check the line above for a missing `;` |\n| CS0103 | Name doesn't exist | A typo, wrong capitals, or out of scope | Check the spelling, and whether it's inside the right `{ }` |\n| CS0117 | Doesn't contain a definition | Wrong capitals or name, like `Writeline` | Use the exact name: `WriteLine` |\n| CS0128 | Already defined in this scope | You declared the same variable twice | Rename it, or drop the type to reassign |\n| CS0136 | Name already used in an enclosing scope | You redeclared a variable inside a block | Drop the type: `grade = \"A\";` |\n| CS0165 | Use of unassigned variable | Some path never gives it a value | Assign it in every branch, usually with a final plain `else` |\n| CS0029 | Can't implicitly convert type | Wrong type, like `int x = \"5\";` | Use `int.Parse`, or fix the type |\n| CS0266 | Can't implicitly convert (cast needed) | A conversion that could lose data, like `int x = 2.5;` | Add a cast, `(int)`, or use `double` |\n| CS0161 | Not all code paths return a value | A method can finish without `return` | Add a `return` for every path |\n| CS8510 | The pattern is unreachable | A switch arm can never match, like `>= 70` after `>= 60` | Put the largest or most specific check first |\n| CS8802 | Only one file can have top-level statements | Two files contain loose code | Rename the extra file, or use a new project |\n| CS8504 | Pattern missing | A switch arm is broken | Often caused by a missing comma: fix CS1003 first |\n\n## Warnings\n\n| Code | Meaning |\n|---|---|\n| CS0219 | A variable is assigned but never used. It's often a sign of a scope mistake or a typo. |\n| CS8602 | You might be calling a method on `null`. This is covered on Day 13. |\n| CS8604 | You might be passing `null` to something that needs a value. |\n\n## Crashes while running\n\n| Exception | Cause | Fix |\n|---|---|---|\n| `FormatException` | `int.Parse(\"abc\")` | Use `TryParse` (Day 17) |\n| `IndexOutOfRangeException` | An index past the end of an array | The last index is `Length - 1` |\n| `NullReferenceException` | Using something that's `null` | Check for `null` first (Day 13) |\n| `DivideByZeroException` | Dividing an `int` by 0 | Check before dividing |\n\n## Compiles but gives the wrong answer\n\nThese are logic errors, so only testing finds them.\n\n| Symptom | Likely cause |\n|---|---|\n| The boundary value is wrong | `>` where you meant `>=` |\n| Everything gets the same grade | Checks are in the wrong order |\n| A decimal result is missing | `int / int` |\n| A loop never ends | The variable in the check never changes |\n| A loop runs one time too many or too few | `<` vs. `<=` |\n| A string doesn't change | You forgot to store the result: `text = text.Trim();` |\n", "rewards": "# Rewards\n\n## Earning points\n\n| What you did | Points |\n|---|---|\n| Each hour of focused C# | 10 |\n| Finishing a day's lesson, including tests and answers | 10 |\n| Finishing a day's bonus | 5 |\n| Fixing an error without asking for help | 2 |\n| Finishing a weekly project | 50 |\n\n## Spending points\n\nReplace these with things you actually want.\n\n| Cost | Reward type | Your reward |\n|---|---|---|\n| 20 | Small | Snack or coffee |\n| 50 | Medium | Guilt-free evening of gaming or a movie |\n| 150 | Big | A good meal out |\n| 500 | Huge | Something you've wanted to buy |\n\n## Milestones\n\nThese are separate from points, and you get them for reaching the milestone itself.\n\n- [ ] **Day 7:** first project finished\n- [ ] **Day 14:** halfway there\n- [ ] **Day 21:** you've built a tracker that saves its data\n- [ ] **Day 30:** your big prize: ______________\n\n## Rules\n\n- Rewards come after the work, never in advance.\n- Points are for real work, so time with your phone in your hand doesn't count.\n- Missing a day costs nothing, and you never lose points.\n\n## Log\n\n| Date | Hours | What you did | Points earned |\n|---|---|---|---|\n| 2026-11-03 | 2 | Days 1\u20133 and the capitals bonus | 55 |\n\n**Total earned:** 55, plus 2 for each error you fixed yourself\n\n**Total spent:** 0\n", "online": "# Running C# online\n\nUse this when the computer doesn't have .NET.\n\n## 1. Pick a site\n\n- [OneCompiler](https://onecompiler.com/csharp): simple, and you enter input before running.\n- [dotnetfiddle](https://dotnetfiddle.net): set **Compiler** to the newest .NET version in the left panel.\n- [Programiz](https://www.programiz.com/csharp-programming/online-compiler/): another option if those are blocked.\n\n## 2. Use this template every time\n\nDelete whatever the site starts with, and paste this:\n\n```csharp\nusing System;\n\nclass Program\n{\n    static void Main()\n    {\n        // your code goes here\n    }\n}\n```\n\nWrite your code inside `Main`, between its `{ }`. For example:\n\n```csharp\nusing System;\n\nclass Program\n{\n    static void Main()\n    {\n        Console.Write(\"What's your name? \");\n        string name = Console.ReadLine();\n\n        Console.WriteLine($\"Hi {name}\");\n    }\n}\n```\n\n## 3. Your own methods\n\nPut them inside `class Program`, next to `Main`, and add `static` in front:\n\n```csharp\nusing System;\n\nclass Program\n{\n    static void Main()\n    {\n        Console.WriteLine(Add(2, 3));\n    }\n\n    static int Add(int a, int b)\n    {\n        return a + b;\n    }\n}\n```\n\n## 4. Typing input\n\nOn OneCompiler, your program can't stop and wait for you to type. Put your answers in the **STDIN** box before pressing Run, one per line:\n\n```\nAlex\n95\n```\n\nThis means you have to decide every answer in advance. For games like Day 4's guessing game, enter your guesses in advance or finish it on your laptop.\n\n## Differences from your laptop\n\n| On your laptop | On these sites |\n|---|---|\n| `using System;` is added for you | You have to write it |\n| Code can sit loose in the file | Code goes inside `Main` |\n| You run `dotnet run` | You press Run |\n\n## Common errors online\n\n| Error | Fix |\n|---|---|\n| `The name 'Console' does not exist` | Add `using System;` at the very top |\n| `Unexpected symbol 'Console'` | Put your code inside `Main`, and check the line above for a missing `;` |\n| `; expected` | Add the missing `;` |\n\nNewer C# features may not work on an older online compiler. If code from the notes fails but looks right, try another site or your laptop.\n\nRemember to copy your code somewhere before closing the tab, or it may be lost.\n"}</script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
const docs = JSON.parse(document.getElementById("docs").textContent);
const main = document.getElementById("doc");
const repo = "https://github.com/dsksnkz/30Days-with-csharp/tree/main/";

function show(page) {
  if (!docs[page]) page = "readme";
  main.innerHTML = marked.parse(docs[page]);

  main.querySelectorAll("table").forEach(t => {
    const box = document.createElement("div");
    box.className = "table";
    t.replaceWith(box);
    box.append(t);
  });

  main.querySelectorAll("a[href]").forEach(a => {
    const href = a.getAttribute("href");
    const md = href.match(/^([A-Za-z0-9]+)\.md$/);
    if (md) a.setAttribute("href", "#" + md[1].toLowerCase());
    else if (!/^https?:/.test(href)) a.setAttribute("href", repo + href);
  });

  document.querySelectorAll("nav a").forEach(a =>
    a.classList.toggle("on", a.getAttribute("href") === "#" + page));
  scrollTo(0, 0);
}

addEventListener("hashchange", () => show(location.hash.slice(1)));
show(location.hash.slice(1));
</script>
