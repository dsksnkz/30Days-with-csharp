<script type="application/json" id="docs">{"readme": "# 30 Days of Python\n\nA 30-day Python course, built to work with no AI help. Plan on 1\u20132 hours a day.\n\n**Progress:** not started. **Next up: Day 1.**\n\n## Where to go\n\n| File | What it's for |\n|---|---|\n| [SETUP.md](SETUP.md) | Start here: install Python on Arch and run your first file |\n| [WEEK1.md](WEEK1.md) | Full lessons for Days 1\u20137 |\n| [ROADMAP.md](ROADMAP.md) | Goals, key ideas and exercises for Days 8\u201330 |\n| [ERRORS.md](ERRORS.md) | What common Python errors mean and how to fix them |\n| [REWARDS.md](REWARDS.md) | Points and rewards |\n| [ONLINE.md](ONLINE.md) | Running Python in a browser |\n| [prompt.md](prompt.md) | A tutor prompt that gives hints, never answers |\n| [my-code/](my-code/) | The code you write, one folder per day |\n\n## Getting stuck without AI\n\nWork through these in order:\n\n1. **Read the traceback from the bottom up.** The last line says what went wrong. The line above it says where.\n2. **Look it up** in [ERRORS.md](ERRORS.md).\n3. **Check the line above too.** A missing `)` or `:` is often reported on the next line.\n4. **Use `print()`** to show your variables and see what they really hold. `print(type(x))` shows what kind of value it is.\n5. **Try it in the REPL.** Type `python` and test one line at a time.\n6. **Search the error message**, for example `Python TypeError can only concatenate str`. Good sources are the [official docs](https://docs.python.org/3/) and Stack Overflow.\n7. **Still stuck after 20 minutes?** Write down the problem, move on, and bring it back later.\n\n## Starting each day\n\n```bash\nmkdir -p ~/30Days-of-python/my-code/Day01 && cd ~/30Days-of-python/my-code/Day01\nnvim lesson.py      # or any editor\npython lesson.py\n```\n\nNo project files and no compiling: a `.py` file is the whole program.\n\n## The daily routine\n\n1. **Learn (20\u201330 min):** read the lesson and run the examples.\n2. **Build (45\u201360 min):** do the exercise without copying.\n3. **Test:** run every test value, especially the boundaries.\n4. **Break it (10 min):** change something, read the error, and fix it.\n5. **Answer the check-yourself questions** from memory.\n6. **Log it:** add your points in [REWARDS.md](REWARDS.md).\n\n## Saving your work\n\nFrom the repo folder:\n\n```bash\ngit add . && git commit -m \"Finish Day 1\" && git push\n```\n\nTo get this repo on another computer:\n\n```bash\ngh repo clone dsksnkz/30Days-of-python\n```\n\n## The plan\n\n| Week | Topic | Project |\n|---|---|---|\n| 1 | Fundamentals | Console quiz game |\n| 2 | Data structures, functions and OOP | Library management system |\n| 3 | Files, JSON, modules, errors and the standard library | Expense tracker that saves its data |\n| 4 | APIs, testing, databases and the web | To-do REST API |\n| Days 28\u201330 | Putting it all together | Task manager API on GitHub |\n\n## The site\n\n`python3 site/build.py` rebuilds `docs/index.html`, a dark reader for these notes. Turn on GitHub Pages from the `docs/` folder to read it on your phone.\n", "setup": "# Setup on Arch Linux\n\n## 1. Install Python\n\nArch usually has it already. Check:\n\n```bash\npython --version\n```\n\nIf you see `Python 3.12` or newer, you're done. If not:\n\n```bash\nsudo pacman -S python python-pip\n```\n\nOn Arch, `python` means Python 3. You don't need to type `python3`, though it works too.\n\n## 2. Pick an editor\n\nAnything works. Good choices:\n\n- **Neovim** (`sudo pacman -S neovim`) if you like the terminal.\n- **VS Code** (`code` from the AUR, or `sudo pacman -S code`) with the Python extension.\n- **Helix** (`sudo pacman -S helix`): Python support out of the box.\n\nSet your editor to use **4 spaces** for indenting. In Python, indenting isn't just tidiness: it's part of the code.\n\n## 3. Your first program\n\n```bash\nmkdir -p ~/30Days-of-python/my-code/Day01 && cd ~/30Days-of-python/my-code/Day01\necho 'print(\"Hello, Python\")' > hello.py\npython hello.py\n```\n\n## 4. The REPL\n\nType `python` with no file to get a `>>>` prompt. It runs each line as soon as you press Enter, which is great for testing a small idea:\n\n```\n>>> 7 / 2\n3.5\n>>> len(\"hello\")\n5\n```\n\nLeave with `exit()` or **Ctrl+D**.\n\n## 5. Installing packages (from Week 3)\n\nArch blocks `pip install` system-wide, and you'll see `error: externally-managed-environment`. That's on purpose. Use a **virtual environment** for each project instead:\n\n```bash\npython -m venv .venv\nsource .venv/bin/activate        # fish: source .venv/bin/activate.fish\npip install requests\ndeactivate                       # when you're done\n```\n\nAdd `.venv/` to `.gitignore`, which this repo already does.\n\n## 6. Hyprland tip\n\nPut the editor and a terminal side by side. Save, switch to the terminal with your workspace keys, and run `python file.py`. To rerun quickly, press the up arrow and Enter.\n", "week1": "# Week 1: Days 1\u20137\n\nDo [SETUP.md](SETUP.md) first.\n\n---\n\n# Day 1: Printing, variables and input\n\n**Goal:** a program that asks questions and answers back.\n\n## `print`\n\n```python\nprint(\"Hello\")\nprint(\"A\", \"B\", \"C\")        # A B C: commas add spaces\nprint(\"A\", end=\"\")          # stays on the same line\nprint(\"B\")                  # AB\n```\n\n## Variables\n\n```python\nname = \"Alex\"\nage = 20\nheight = 1.75\nis_student = True\n```\n\nYou don't write a type. Python works it out from the value. `type(age)` shows it: `<class 'int'>`.\n\nNames use `snake_case`: lowercase with underscores. They can't start with a digit, and `Name` and `name` are different variables.\n\n## `input`\n\n```python\nname = input(\"What's your name? \")\nprint(\"Hi\", name)\n```\n\n`input()` **always gives back a string**, even if you type `20`. Keep that in mind for Day 2.\n\n## f-strings\n\n```python\nname = \"Alex\"\nage = 20\nprint(f\"{name} is {age} years old\")\n```\n\nThe `f` before the quote lets you put variables inside `{ }`.\n\n## Comments\n\n```python\n# Python ignores everything after a hash.\n```\n\n## Exercise: about me\n\nAsk for the user's name, favorite food and home town. Then print one sentence using all three with an f-string.\n\n| Input | Expected result |\n|---|---|\n| Alex, pizza, Leeds | `Alex from Leeds loves pizza.` |\n\n**Bonus:** print the same sentence in a box of `*` characters. Hint: `\"*\" * 10` gives ten stars.\n\n## Check yourself\n\n1. What does `input()` always give back?\n2. What does `end=\"\"` do in `print`?\n3. Why does `print(f\"{name}\")` work but `print(\"{name}\")` doesn't?\n4. Are `Score` and `score` the same variable?\n\n---\n\n# Day 2: Numbers and converting types\n\n**Goal:** a tip calculator.\n\n## Maths\n\n```python\nprint(7 + 2)    # 9\nprint(7 - 2)    # 5\nprint(7 * 2)    # 14\nprint(7 / 2)    # 3.5: always a float\nprint(7 // 2)   # 3: whole-number division\nprint(7 % 2)    # 1: the remainder\nprint(2 ** 3)   # 8: power\n```\n\nUnlike C#, `7 / 2` gives `3.5`. Use `//` when you want to drop the decimal.\n\n## Converting\n\n```python\nage = int(input(\"Age? \"))        # text to whole number\nprice = float(input(\"Price? \"))  # text to decimal\ntext = str(42)                   # number to text\n```\n\nTyping `abc` into `int(...)` crashes with `ValueError`. You'll learn to handle that on Day 13.\n\n`int(4.9)` gives `4`. It cuts off, it doesn't round. Use `round(4.9)` to round.\n\n## The `str + int` trap\n\n```python\nage = 20\nprint(\"Age: \" + age)       # TypeError\nprint(\"Age: \" + str(age))  # works\nprint(f\"Age: {age}\")       # works, and nicer\n```\n\n## Formatting decimals\n\n```python\ntotal = 10 / 3\nprint(f\"{total:.2f}\")   # 3.33\n```\n\n## Exercise: tip calculator\n\nAsk for the bill amount, the tip percentage and the number of people. Print the tip, the total and what each person pays, all to 2 decimal places.\n\n| Bill | Tip % | People | Tip | Total | Each |\n|---|---|---|---|---|---|\n| 100 | 10 | 2 | 10.00 | 110.00 | 55.00 |\n| 50 | 15 | 3 | 7.50 | 57.50 | 19.17 |\n| 80 | 0 | 1 | 0.00 | 80.00 | 80.00 |\n\n**Bonus:** try 0 people. Read the error, and write down what it's called.\n\n## Check yourself\n\n1. What's the difference between `/` and `//`?\n2. What does `10 % 3` give?\n3. Why does `\"5\" + 5` fail?\n4. What does `int(7.99)` give?\n\n---\n\n# Day 3: Decisions\n\n**Goal:** a grade calculator.\n\n## `if`, `elif`, `else`\n\n```python\nscore = int(input(\"Score? \"))\n\nif score >= 90:\n    print(\"A\")\nelif score >= 80:\n    print(\"B\")\nelse:\n    print(\"Keep going\")\n```\n\n- The line ends with a **colon**.\n- The code inside is **indented 4 spaces**. That's how Python knows where the block ends. There are no `{ }`.\n- The **first match wins**, so put the largest check first.\n\n## Comparisons and logic\n\n```python\nx == 5     # equal (= assigns, == compares)\nx != 5     # not equal\nx >= 5     # also <, >, <=\nage >= 13 and age <= 19\nday == \"Sat\" or day == \"Sun\"\nnot is_raining\n13 <= age <= 19          # Python lets you chain these\n```\n\n## `match`\n\nGood for picking from fixed options:\n\n```python\ncommand = input(\"Command? \")\n\nmatch command:\n    case \"start\":\n        print(\"Starting\")\n    case \"stop\" | \"quit\":\n        print(\"Stopping\")\n    case _:\n        print(\"Unknown command\")\n```\n\n`case _` catches everything else, like `default` in other languages.\n\n## Exercise: grade calculator\n\nAsk for a score from 0 to 100 and print the grade: 90+ is `A`, 80+ is `B`, 70+ is `C`, 60+ is `D`, and anything lower is `F`. Print `Invalid` for anything below 0 or above 100.\n\n| Input | Expected result |\n|---|---|\n| 95 | A |\n| 90 | A |\n| 89 | B |\n| 60 | D |\n| 59 | F |\n| 0 | F |\n| 101 | Invalid |\n| -5 | Invalid |\n\n**Bonus:** ask for a country and print its capital using `match`, with at least 4 countries and a message for unknown ones. Make it work whatever capitals the user types. Hint: `.lower()`.\n\n## Check yourself\n\n1. What happens if you forget the colon after `if`?\n2. Why must `>= 90` come before `>= 80`?\n3. What's the difference between `=` and `==`?\n4. What does `case _` do?\n\n---\n\n# Day 4: Loops\n\n**Goal:** a number guessing game.\n\n## `for` with `range`\n\n```python\nfor i in range(1, 6):\n    print(i)        # 1 to 5\n```\n\n`range(1, 6)` stops **before** 6. `range(5)` gives 0 to 4. `range(0, 10, 2)` gives 0, 2, 4, 6, 8.\n\n## `for` over anything\n\n```python\nfor letter in \"cat\":\n    print(letter)\n```\n\n## `while`\n\n```python\nlives = 3\n\nwhile lives > 0:\n    print(f\"Lives: {lives}\")\n    lives -= 1\n```\n\nIf you forget `lives -= 1`, it never ends. Press **Ctrl+C** to stop it.\n\nPython has no `do`/`while`. Use `while True:` with `break` instead:\n\n```python\nwhile True:\n    answer = input(\"Type yes: \")\n    if answer == \"yes\":\n        break\n```\n\n## `break` and `continue`\n\n```python\nfor i in range(1, 11):\n    if i == 3:\n        continue    # skip to 4\n    if i == 6:\n        break       # leave the loop\n    print(i)        # 1 2 4 5\n```\n\n## Random numbers\n\n```python\nimport random\n\nsecret = random.randint(1, 100)\n```\n\n`randint` **includes both ends**, so this can give 1 or 100. That's the opposite of `range`.\n\n`import` lines go at the top of the file.\n\n## Exercise: number guessing game\n\n1. Pick a secret number from 1 to 100.\n2. Keep asking for a guess until the player gets it.\n3. After each wrong guess, print `Too high` or `Too low`.\n4. Count the guesses, and print the total when the player wins.\n\nWhile testing, print `secret` at the start, and remove that line when you're done.\n\n| Secret | Input | Expected result |\n|---|---|---|\n| 50 | 75 | Too high |\n| 50 | 25 | Too low |\n| 50 | 50 | You win, 3 guesses |\n\n**Bonus 1:** give the player only 7 guesses, then reveal the number.\n\n**Bonus 2:** ask `Play again?` at the end, with a loop around the whole game.\n\n## Check yourself\n\n1. What numbers does `range(2, 5)` give?\n2. Can `random.randint(1, 10)` give 10?\n3. How do you get the effect of a `do`/`while` in Python?\n4. What's the difference between `break` and `continue`?\n\n---\n\n# Day 5: Functions\n\n**Goal:** split your code into reusable, named pieces.\n\n## Writing a function\n\n```python\ndef greet(name):\n    print(f\"Hi {name}\")\n\ndef add(a, b):\n    return a + b\n\ngreet(\"Alex\")\ntotal = add(2, 3)\nprint(total)\n```\n\n- `def`, the name, the parameters, then a colon and an indented body.\n- **Define functions before you call them.** Python runs top to bottom, so calling `greet` above its `def` gives `NameError`.\n- `return` sends a value back and ends the function at once. A function with no `return` gives back `None`.\n\n## Default and keyword arguments\n\n```python\ndef say(text, times=1):\n    for _ in range(times):\n        print(text)\n\nsay(\"hi\")\nsay(\"hi\", 3)\nsay(times=2, text=\"hey\")   # named, so order doesn't matter\n```\n\n`_` is the usual name for a loop variable you don't use.\n\n## Type hints\n\nOptional, but they make code easier to read:\n\n```python\ndef add(a: float, b: float) -> float:\n    return a + b\n```\n\nPython doesn't check them when it runs. They're notes for you and your editor.\n\n## Exercise: calculator\n\nWrite `add`, `subtract`, `multiply` and `divide`, each taking two numbers and returning the result. Write `read_number(prompt)`, which asks with the prompt and returns a `float`.\n\nThen ask for two numbers and an operator (`+`, `-`, `*`, `/`), use `match` to pick the function, and print the result to 2 decimal places.\n\n| Input | Expected result |\n|---|---|\n| 6, +, 3 | 9.00 |\n| 6, -, 3 | 3.00 |\n| 6, *, 3 | 18.00 |\n| 7, /, 2 | 3.50 |\n| 6, /, 0 | See bonus |\n\nUnlike C#, dividing by 0 crashes. Run it and read the error.\n\n**Bonus:** print a clear error instead of crashing when dividing by 0.\n\n## Check yourself\n\n1. What does a function give back if it has no `return`?\n2. What happens to code after `return` in the same function?\n3. Why can't you call a function above its `def`?\n4. Why is `read_number` better than repeating `float(input(...))`?\n\n---\n\n# Day 6: Lists and strings\n\n**Goal:** work with groups of values and text.\n\n## Lists\n\n```python\nscores = [90, 75, 60]\n\nprint(scores[0])      # 90: counting starts at 0\nprint(scores[-1])     # 60: negative counts from the end\nprint(len(scores))    # 3\nscores[1] = 80\nscores.append(100)    # add to the end\nscores.remove(60)     # remove by value\nprint(sum(scores), max(scores), min(scores))\n\nfor score in scores:\n    print(score)\n\nfor i, score in enumerate(scores):\n    print(i, score)\n```\n\nUnlike a C# array, a list can grow. `scores[10]` still crashes with `IndexError`.\n\n## Slicing\n\n```python\nletters = [\"a\", \"b\", \"c\", \"d\", \"e\"]\nprint(letters[1:3])   # ['b', 'c']: stops before 3\nprint(letters[:2])    # ['a', 'b']\nprint(letters[::-1])  # reversed\n```\n\nSlicing works on strings too.\n\n## Strings\n\n```python\ntext = \"  Hello World  \"\n\nprint(text.strip())            # removes outer spaces\nprint(text.lower())\nprint(\"World\" in text)         # True\nprint(text.replace(\"World\", \"Python\"))\nprint(len(text.strip()))       # 11\nprint(text.strip()[0])         # H\n\nwords = \"one two three\".split()\nprint(len(words))              # 3\nprint(\"-\".join(words))         # one-two-three\n```\n\nStrings can't be changed. `text.upper()` on its own does nothing useful, so store it: `text = text.upper()`.\n\n## Exercise: text analyzer\n\nAsk for a sentence, then print:\n1. The number of characters.\n2. The number of words.\n3. The number of vowels (a, e, i, o, u), counting capitals too.\n4. The sentence reversed, using a `for` loop that builds a new string. Then do it again with a slice and check they match.\n\n| Input | Characters | Words | Vowels | Reversed |\n|---|---|---|---|---|\n| `Hello World` | 11 | 2 | 3 | `dlroW olleH` |\n| `Python is fun` | 13 | 3 | 3 | `nuf si nohtyP` |\n\n**Bonus:** say whether the input is a palindrome, ignoring capitals. `Level` should say yes.\n\n## Check yourself\n\n1. What's `scores[-1]`?\n2. What does `\"hello\"[1:4]` give?\n3. Why doesn't `text.upper()` change `text`?\n4. What's the difference between `split()` and `join()`?\n\n---\n\n# Day 7: Project: console quiz game\n\nNo new topics today. You're combining everything, without a walkthrough.\n\n## Requirements\n\n1. Ask for the player's name, and use `strip()` on it.\n2. Store at least 5 questions in a list, with the answers in a second list at matching positions.\n3. Loop through the questions and ask each one.\n4. Compare answers while ignoring capitals and extra spaces.\n5. Say whether each answer was right, and show the correct one if not.\n6. At the end, print the score and percentage to 1 decimal place.\n7. Print a rank: 100% is `Perfect`, 60% or above is `Passed`, and anything else is `Try again`.\n8. Use at least 2 functions of your own, such as `ask_question` and `get_rank`.\n\n## Watch out\n\n- `get_rank` needs to `return` the rank, not `print` it, if you want to use it in an f-string.\n- Use `zip(questions, answers)` to loop over both lists together, or `range(len(questions))`.\n\n## Test it\n\n| Scenario (5 questions) | Expected result |\n|---|---|\n| All correct | 100.0%, Perfect |\n| 3 correct | 60.0%, Passed |\n| 2 correct | 40.0%, Try again |\n| All wrong | 0.0%, Try again |\n| Answer typed as `  PARIS  ` when correct is `Paris` | Counts as correct |\n\n## Bonus\n\n- Ask whether to play again.\n- Make it multiple choice. Only allow 1\u20134, and ask again for anything else. Hint: `.isdigit()`.\n\n**Well done: that's Week 1. Check [REWARDS.md](REWARDS.md) for your milestone reward.**\n", "roadmap": "# Roadmap: Days 8\u201330\n\nEach day lists what to learn, the main ideas, and what to build. Read the linked topic in the [official tutorial](https://docs.python.org/3/tutorial/) for the details. Searching `Python <topic name>` also works well.\n\n## Week 2: Data structures, functions and OOP\n\n**Day 8: Dictionaries.** Look up values by a key instead of a position. Learn `d[key]`, `d.get(key, default)`, `in`, `del`, and looping with `.items()`.\n```python\nages = {\"Alex\": 20, \"Sam\": 25}\nages[\"Jo\"] = 31\nfor name, age in ages.items():\n    print(name, age)\n```\n**Build:** a contact book with add, find, delete and list, in a menu loop.\n\n**Day 9: Tuples, sets and comprehensions.** Tuples are lists that can't change. Sets have no duplicates. Comprehensions build a list in one line.\n```python\nsquares = [n * n for n in range(10) if n % 2 == 0]\n```\n**Build:** read a paragraph and print the unique words, sorted, with a count of each. Use a set and a dict comprehension.\n\n**Day 10: Functions, deeper.** Learn scope (local vs. global), `*args` and `**kwargs`, returning several values as a tuple, and `lambda`. Pass functions to `sorted(key=...)`, `map` and `filter`.\n**Build:** sort a list of `(name, score)` tuples by score, then by name. Write a `stats(*numbers)` function that returns min, max and average.\n\n**Day 11: Classes and objects.** A class is a blueprint, and an object is one thing made from it. Learn `__init__`, `self`, attributes and methods.\n```python\nclass BankAccount:\n    def __init__(self, owner, balance=0):\n        self.owner = owner\n        self.balance = balance\n\n    def deposit(self, amount):\n        self.balance += amount\n```\n**Build:** `BankAccount` with `deposit`, `withdraw` and `__str__`. Make two accounts and show that they keep separate balances.\n\n**Day 12: Inheritance and dunder methods.** Learn `class Manager(Employee)`, `super().__init__()`, overriding methods, and `__repr__`, `__eq__` and `__lt__`. Use `@property` to protect data.\n**Build:** `Employee` with `calculate_pay()`, then `Manager` and `Intern`, which each override it. Make `BankAccount.balance` a read-only property, and reject negative deposits.\n\n**Day 13: Exceptions.** Learn `try`, `except`, `else`, `finally` and `raise`. This is the proper fix for the `abc` crash from Day 2.\n```python\ntry:\n    number = int(input(\"Number? \"))\nexcept ValueError:\n    print(\"Not a number\")\n```\n**Build:** a `read_int(prompt)` function that keeps asking until the input is valid. Add a custom `InsufficientFundsError` to `BankAccount`.\n\n**Day 14: Project: library management system.** `Book` and `Member` classes, and a `Library` class. Support adding books, borrowing, returning and listing. A book that's already borrowed can't be borrowed again. Use a console menu in a loop, and handle bad input without crashing.\n\n## Week 3: Real-world Python\n\n**Day 15: Files.** Learn `with open(...) as f`, the modes `\"r\"`, `\"w\"` and `\"a\"`, `.read()`, looping over lines, and `pathlib.Path`.\n**Build:** a journal that appends a dated line to a text file, and can print every entry.\n\n**Day 16: JSON and CSV.** Learn `json.dump`, `json.load` and the `csv` module. Dicts and lists map straight to JSON.\n**Build:** save the contact book from Day 8 to JSON, and load it on startup. Export it to CSV, and open the CSV in a spreadsheet.\n\n**Day 17: Modules and packages.** Split code into several files and `import` between them. Learn `if __name__ == \"__main__\":`, and how a folder becomes a package.\n**Build:** move the library system's classes into `models.py`, and keep the menu in `main.py`.\n\n**Day 18: The standard library.** Learn `datetime`, `collections` (`Counter`, `defaultdict`), `itertools`, `os`, `sys.argv` and `argparse`.\n**Build:** a command-line tool: `python count.py file.txt --top 5` prints the five most common words.\n\n**Day 19: Virtual environments and pip.** Learn `python -m venv`, `pip install`, `pip freeze > requirements.txt`, and why Arch blocks system-wide installs. See [SETUP.md](SETUP.md).\n**Build:** install `rich` in a venv, and print a coloured table of your library's books.\n\n**Day 20: Dataclasses, typing and iterators.** Learn `@dataclass`, type hints with `list[str]` and `str | None`, generators with `yield`, and running `mypy` to check types.\n**Build:** rewrite `Book` as a dataclass. Write a generator that reads a big file one line at a time.\n\n**Day 21: Project: expense tracker.** Add, list and delete expenses, with totals per category and per month. Save to JSON and load it on startup. Close the program, reopen it, and check that the data is still there. This is also a good time to build your rewards tracker.\n\n## Week 4: Professional tools\n\n**Day 22: HTTP and APIs.** Learn `requests.get`, status codes, `.json()`, and timeouts.\n**Build:** a weather app using the free [Open-Meteo API](https://open-meteo.com/), which needs no key. Handle network failures and a city that doesn't exist.\n\n**Day 23: Async.** Learn `async def`, `await`, `asyncio.run`, `asyncio.gather` and `asyncio.sleep`.\n**Build:** simulate 3 slow downloads with `asyncio.sleep`. Time them one after another and then together.\n\n**Day 24: Testing.** Install `pytest`, write `test_*.py` files with plain `assert`, and learn `pytest.raises` and `@pytest.mark.parametrize`.\n**Build:** tests for the expense tracker, including boundaries and bad input.\n\n**Day 25: Databases.** Learn basic SQL (`SELECT`, `INSERT`, `UPDATE`, `DELETE`) with the built-in `sqlite3` module. Always use `?` placeholders, never f-strings, in SQL.\n**Build:** move the expense tracker from JSON to SQLite.\n\n**Day 26: Code quality.** Learn `ruff` for linting and formatting, docstrings, and PEP 8. Set up `pyproject.toml`.\n**Build:** run `ruff check` and `ruff format` on all your code, and fix every warning.\n\n**Day 27: Web APIs with FastAPI.** Install `fastapi` and `uvicorn`. Learn `@app.get` and `@app.post`, path and query parameters, Pydantic models, and status codes (200, 201, 404, 422).\n**Build:** a to-do REST API. Test it with `curl` and with the docs page at `/docs`.\n\n## Final stretch: capstone\n\n**Day 28: Design.** Split the project into routes, services and a database layer. Learn FastAPI dependencies with `Depends`.\n**Build:** the task manager API's data model, SQLite database and project structure.\n\n**Day 29: Finish the features.** Add full create, read, update and delete, filtering by status, validation with clear errors, and tests using FastAPI's `TestClient`.\n\n**Day 30: Ship it.** Add logging and settings from environment variables, write a good README, and push it to GitHub.\n\n**That's the course. Claim your Day 30 prize!**\n", "errors": "# Common errors\n\nAn error in Python is called a **traceback**:\n\n```\nTraceback (most recent call last):\n  File \"/home/you/Day02/tip.py\", line 3, in <module>\n    total = bill + tip\n            ~~~~~^~~~~\nTypeError: unsupported operand type(s) for +: 'int' and 'str'\n```\n\n**Read it from the bottom up.** The last line is the error type and message. The lines above show the file, the line number, and the code that broke.\n\nUnlike C#, Python finds most errors only **when that line runs**. Code in an `if` branch you never take can hide a bug, so test every path.\n\n## Errors before anything runs\n\n| Error | What it usually means | Fix |\n|---|---|---|\n| `SyntaxError: expected ':'` | Missing colon after `if`, `for`, `while`, `def` or `class` | Add `:` at the end of the line |\n| `SyntaxError: '(' was never closed` | A bracket isn't closed | Count your brackets. The real mistake is often on the line above |\n| `SyntaxError: invalid syntax. Maybe you meant '==' ...` | `=` inside an `if` | Use `==` to compare |\n| `SyntaxError: unterminated string literal` | A missing closing quote | Add the quote |\n| `IndentationError: expected an indented block` | Nothing indented after a line ending in `:` | Indent the body 4 spaces |\n| `IndentationError: unexpected indent` | A line is indented when it shouldn't be | Line it up with the code around it |\n| `TabError: inconsistent use of tabs and spaces` | You mixed tabs and spaces | Set your editor to always insert 4 spaces |\n\n## Errors while running\n\n| Error | Example cause | Fix |\n|---|---|---|\n| `NameError: name 'x' is not defined` | A typo, wrong capitals, or using it before it's created | Check spelling, and put `def` above the call |\n| `TypeError: can only concatenate str (not \"int\") to str` | `\"Age: \" + 20` | Use an f-string, or `str(20)` |\n| `TypeError: unsupported operand type(s)` | Maths on a string from `input()` | Convert with `int()` or `float()` |\n| `TypeError: f() missing 1 required positional argument` | Calling a function with too few arguments | Pass every argument, or give it a default |\n| `TypeError: 'NoneType' object is not subscriptable` | Using the result of a function that has no `return` | Add a `return` |\n| `ValueError: invalid literal for int()` | `int(\"abc\")` or `int(\"2.5\")` | Use `try`/`except` (Day 13), or `float()` first |\n| `IndexError: list index out of range` | `items[5]` on a 5-item list | The last index is `len(items) - 1` |\n| `KeyError: 'Sam'` | A dict has no such key | Check with `in`, or use `.get()` |\n| `AttributeError: 'str' object has no attribute 'push'` | The method doesn't exist for that type | Check the name: lists use `append` |\n| `ZeroDivisionError: division by zero` | Dividing by 0 | Check before dividing |\n| `ModuleNotFoundError: No module named 'requests'` | The package isn't installed, or your venv isn't active | `source .venv/bin/activate`, then `pip install` |\n| `RecursionError: maximum recursion depth exceeded` | A function calls itself forever | Add a stopping case |\n| `error: externally-managed-environment` | `pip install` outside a venv on Arch | Use a venv. See [SETUP.md](SETUP.md) |\n\n## Runs but gives the wrong answer\n\nThese are logic errors, so only testing finds them.\n\n| Symptom | Likely cause |\n|---|---|\n| The boundary value is wrong | `>` where you meant `>=` |\n| Everything gets the same grade | Checks are in the wrong order |\n| `\"5\" + \"5\"` gives `55` | You forgot to convert `input()` |\n| A loop never ends | The variable in the check never changes |\n| A loop runs one time too many or too few | `range` stops before its end value |\n| A string doesn't change | You forgot to store the result: `text = text.strip()` |\n| Code after a loop runs inside it | It's indented one level too far |\n| A function prints `None` | It uses `print` instead of `return` |\n| Changing one list changes another | `b = a` shares the list. Use `b = a.copy()` |\n", "rewards": "# Rewards\n\n## Earning points\n\n| What you did | Points |\n|---|---|\n| Each hour of focused Python | 10 |\n| Finishing a day's lesson, including tests and answers | 10 |\n| Finishing a day's bonus | 5 |\n| Fixing an error without asking for help | 2 |\n| Finishing a weekly project | 50 |\n\n## Spending points\n\nReplace these with things you actually want.\n\n| Cost | Reward type | Your reward |\n|---|---|---|\n| 20 | Small | Snack or coffee |\n| 50 | Medium | Guilt-free evening of gaming or a movie |\n| 150 | Big | A good meal out |\n| 500 | Huge | Something you've wanted to buy |\n\n## Milestones\n\nThese are separate from points, and you get them for reaching the milestone itself.\n\n- [ ] **Day 7:** first project finished\n- [ ] **Day 14:** halfway there\n- [ ] **Day 21:** you've built a tracker that saves its data\n- [ ] **Day 30:** your big prize: ______________\n\n## Rules\n\n- Rewards come after the work, never in advance.\n- Points are for real work, so time with your phone in your hand doesn't count.\n- Missing a day costs nothing, and you never lose points.\n\n## Log\n\n| Date | Hours | What you did | Points earned |\n|---|---|---|---|\n| | | | |\n\n**Total earned:** 0\n\n**Total spent:** 0\n", "online": "# Running Python online\n\nUse this when the computer doesn't have Python.\n\n## 1. Pick a site\n\n- [OneCompiler](https://onecompiler.com/python): simple, and you enter input before running.\n- [Programiz](https://www.programiz.com/python-programming/online-compiler/): lets you type input while it runs.\n- [Python.org shell](https://www.python.org/shell/): a quick REPL for testing one line at a time.\n\n## 2. Just paste your code\n\nUnlike C#, there's no template. Your file works as it is.\n\n## 3. Typing input\n\nOn OneCompiler, your program can't stop and wait for you to type. Put your answers in the **STDIN** box before pressing Run, one per line:\n\n```\nAlex\n95\n```\n\nFor games like Day 4's guessing game, use Programiz, which does wait for input, or finish it on your laptop.\n\n## Differences from your laptop\n\n| On your laptop | On these sites |\n|---|---|\n| You run `python file.py` | You press Run |\n| You can `pip install` packages | Only the standard library, usually |\n| Files you write stay on disk | Files may disappear when you close the tab |\n\nDays 1\u201318 work fine online. From Day 19, you need packages, so use your laptop.\n\nRemember to copy your code somewhere before closing the tab, or it may be lost.\n"}</script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
const docs = JSON.parse(document.getElementById("docs").textContent);
const main = document.getElementById("doc");
const repo = "https://github.com/dsksnkz/30Days-of-python/tree/main/";

function show(page) {
  if (!docs[page]) page = "readme";
  main.innerHTML = marked.parse(docs[page]);

  main.querySelectorAll("table").forEach(t => {
    const box = document.createElement("div");
    box.className = "table";
    t.replaceWith(box);
    box.append(t);
  });

  main.querySelectorAll("a[href]").forEach(a => {
    const href = a.getAttribute("href");
    const md = href.match(/^([A-Za-z0-9]+)\.md$/);
    if (md) a.setAttribute("href", "#" + md[1].toLowerCase());
    else if (!/^https?:/.test(href)) a.setAttribute("href", repo + href);
  });

  document.querySelectorAll("nav a").forEach(a =>
    a.classList.toggle("on", a.getAttribute("href") === "#" + page));
  scrollTo(0, 0);
}

addEventListener("hashchange", () => show(location.hash.slice(1)));
show(location.hash.slice(1));
</script>
