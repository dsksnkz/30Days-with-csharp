<title>30 Days of Python</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* One narrow reading column under a plain row of links. */
:root {
  --bg: #15161a; --fg: #d9dadf; --dim: #8b8e99; --line: #2c2e36;
  --code: #1e2026; --link: #9db8e8;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font: 16px/1.65 var(--sans); }
#wrap {
  max-width: 46rem; margin: 0 auto; padding-block: 1rem 5rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
nav { display: flex; flex-wrap: wrap; gap: .25rem 1.25rem; padding-bottom: .75rem; border-bottom: 1px solid var(--line); }
nav a { color: var(--dim); text-decoration: none; }
nav a:hover { color: var(--fg); }
nav a.on { color: var(--fg); font-weight: 600; }
a { color: var(--link); }
a:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
h1, h2, h3 { line-height: 1.25; color: #f1f2f5; text-wrap: balance; }
h1 { font-size: 1.75rem; margin: 2rem 0 1rem; }
h2 { font-size: 1.3rem; margin: 2.25rem 0 .75rem; }
h3 { font-size: 1.05rem; margin: 1.5rem 0 .5rem; }
p, ul, ol { margin: 0 0 1rem; }
ul, ol { padding-left: 1.5rem; }
li { margin-bottom: .25rem; }
hr { border: 0; border-top: 1px solid var(--line); margin: 3rem 0; }
code { font: .9em var(--mono); background: var(--code); padding: .1em .3em; border-radius: 3px; }
pre { background: var(--code); padding: .85rem 1rem; overflow-x: auto; border-radius: 4px; margin: 0 0 1rem; line-height: 1.5; }
pre code { background: none; padding: 0; font-size: .875rem; }
.table { overflow-x: auto; margin: 0 0 1rem; }
table { border-collapse: collapse; width: 100%; font-size: .9375rem; }
th, td { text-align: left; vertical-align: top; padding: .45rem .75rem .45rem 0; border-bottom: 1px solid var(--line); }
th { color: var(--dim); font-weight: 600; }
li > input { margin-right: .4rem; }
</style>
<div id="wrap">
  <nav>{{NAV}}</nav>
  <main id="doc"></main>
</div>
<script type="application/json" id="docs">{{DATA}}</script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
const docs = JSON.parse(document.getElementById("docs").textContent);
const main = document.getElementById("doc");
const repo = "https://github.com/dsksnkz/30Days-of-python/tree/main/";

function show(page) {
  if (!docs[page]) page = "readme";
  main.innerHTML = marked.parse(docs[page]);

  main.querySelectorAll("table").forEach(t => {
    const box = document.createElement("div");
    box.className = "table";
    t.replaceWith(box);
    box.append(t);
  });

  main.querySelectorAll("a[href]").forEach(a => {
    const href = a.getAttribute("href");
    const md = href.match(/^([A-Za-z0-9]+)\.md$/);
    if (md) a.setAttribute("href", "#" + md[1].toLowerCase());
    else if (!/^https?:/.test(href)) a.setAttribute("href", repo + href);
  });

  document.querySelectorAll("nav a").forEach(a =>
    a.classList.toggle("on", a.getAttribute("href") === "#" + page));
  scrollTo(0, 0);
}

addEventListener("hashchange", () => show(location.hash.slice(1)));
show(location.hash.slice(1));
</script>
